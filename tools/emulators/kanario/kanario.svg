  <path d="M214 286 q40 -10 82 4 M206 304 q40 -6 80 8" stroke="#e85d04" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- beak -->
  <path d="M380 180 L424 196 L380 208 Z" fill="#fb8500"/>
  <path d="M380 196 L420 197" stroke="#c2410c" stroke-width="3"/>
  <!-- eye -->
  <circle cx="346" cy="176" r="15" fill="#1b1033"/>
  <circle cx="351" cy="171" r="5" fill="#ffffff"/>
  <!-- cheek -->
  <circle cx="340" cy="210" r="11" fill="#ff8fab" opacity="0.6"/>
  <!-- feet -->
  <path d="M236 380 v20 m-10 0 h22 M282 378 v22 m-10 0 h22" stroke="#e85d04" stroke-width="7" stroke-linecap="round"/>
