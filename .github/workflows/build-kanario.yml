# AriseOS Kanario (formerly Orchid): Frizti's Fritchii core with tools/emulators/patches/kanario (AriseOS fixes and Hokkaido ports).
# Copied from build-lichii-frizti.yml (generated by tools/emulators/gen_workflows.py from Frizti/Lichii's release workflow). To take a newer upstream build
# system, regenerate; to build a newer version, run this workflow with its tag.
name: build Kanario for AriseOS
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch of Frizti/Lichii (Fritchii v5.8.4 by default)
        required: true
        default: 4f5c53149b7e17d1c24445f68d79a83a3b2a17f9
permissions:
  contents: write
jobs:
  build:
    name: Kanario linux-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux-aarch64
          runner: ubuntu-24.04-arm
    steps:
    - name: Check out source
      uses: actions/checkout@v5
      with:
        # Frizti/Lichii went away on 2026-11-13; its commits are still served by the repository it was forked from.
        repository: zortos293/Lichii
        ref: ${{ inputs.ref }}
    - name: Check out the AriseOS patches
      uses: actions/checkout@v5
      with:
        path: _arise
        sparse-checkout: tools/emulators
    - name: Apply the AriseOS patches
      shell: bash
      run: |
        set -euo pipefail
        python3 _arise/tools/emulators/arise_patches.py kanario
    - name: Install Linux dependencies
      if: startsWith(matrix.platform, 'linux')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
          libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
          mesa-common-dev nasm ninja-build qt6-base-private-dev \
          qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
          libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
          spirv-tools spirv-headers libusb-1.0-0-dev \
          libboost-dev libboost-fiber-dev libboost-context-dev \
          libopus-dev libasound2-dev ccache \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
    - name: Install macOS dependencies
      if: startsWith(matrix.platform, 'macos')
      shell: bash
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: 1
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        brew install autoconf automake boost ffmpeg fmt glslang hidapi libtool libusb lz4 ninja \
          nlohmann-json openssl pkg-config qt@6 sdl3 speexdsp zlib zstd cmake catch2 molten-vk \
          vulkan-loader spirv-tools vulkan-utility-libraries ccache
    - name: Install Qt on Linux x86_64
      if: startsWith(matrix.platform, 'linux') && runner.arch != 'ARM64'
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: linux
        target: desktop
        arch: linux_gcc_64
        modules: qtcharts
        cache: true
    - name: Install Qt on Linux ARM64
      if: startsWith(matrix.platform, 'linux') && runner.arch == 'ARM64'
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: linux_arm64
        target: desktop
        arch: linux_gcc_arm64
        modules: qtcharts
        cache: true
    - name: Install clang for PGO
      if: startsWith(matrix.platform, 'linux') && matrix.pgo
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
          sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
          sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
        "clang-$PGO_LLVM_VERSION" --version
    - name: Check PGO profile
      if: matrix.pgo
      shell: bash
      run: |
        set -euo pipefail
        test -s eglantine.profdata
    - name: Set up MSVC
      if: matrix.platform == 'windows-x86_64'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Install Qt on Windows
      if: matrix.platform == 'windows-x86_64'
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qtcharts
        cache: true
    - name: Install sccache on Windows
      if: matrix.platform == 'windows-x86_64'
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
        Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
        Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
        $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
        $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
    - name: Install Vulkan SDK on Windows
      if: matrix.platform == 'windows-x86_64'
      shell: pwsh
      run: ./tools/windows/install-vulkan-sdk.ps1
    - name: Verify Vulkan tools on Windows
      if: matrix.platform == 'windows-x86_64'
      shell: pwsh
      run: glslangValidator --version
    - name: Set up MSYS2
      if: matrix.mingw
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: true
        install: git make autoconf libtool automake-wrapper patch jq pactoys ninja
        pacboy: toolchain:p clang:p lld:p cmake:p python-pip:p qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p vulkan-memory-allocator:p
          vulkan-devel:p glslang:p enet:p opus:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p
    - name: Restore CPM downloads
      id: cpm-cache
      uses: actions/cache/restore@v5
      with:
        path: .cache/cpm
        key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
        restore-keys: |
          cpm-${{ matrix.platform }}-v2-
          cpm-${{ runner.os }}-
    - name: Restore compiler objects
      id: compiler-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          .ccache
          .sccache
        key: objects-${{ matrix.platform }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          objects-${{ matrix.platform }}-v2-${{ github.sha }}-
          objects-${{ matrix.platform }}-v2-
    - name: Configure Linux
      if: startsWith(matrix.platform, 'linux')
      shell: bash
      run: |
        set -euo pipefail
        flags=(
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DVulkanHeaders_FORCE_BUNDLED=ON
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DLICHII_BUILD_TAG=build-${{ github.run_number }}
          -DLICHII_BUILD_PLATFORM=${{ matrix.platform }}
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON
          -DKANARIO_BUILD=ON
          -DENABLE_WERROR=OFF
        )
        if [ '${{ matrix.pgo }}' = 'true' ]; then
          # Same flags Eden's CI passes for its clang PGO build.
          profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          flags+=(
            "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
            "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
            "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
            "-DCMAKE_C_FLAGS=$profile"
            "-DCMAKE_CXX_FLAGS=$profile"
          )
        fi
        cmake -S . -B build/release -G Ninja "${flags[@]}"
    - name: Configure Windows
      if: matrix.platform == 'windows-x86_64'
      shell: bash
      run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON
        -DENABLE_UPDATE_CHECKER=ON -DLICHII_BUILD_TAG=build-${{ github.run_number }} -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} -DUSE_DISCORD_PRESENCE=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
    - name: Configure macOS
      if: startsWith(matrix.platform, 'macos')
      shell: bash
      run: |
        set -euo pipefail
        cmake -S . -B build/release -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF \
          -DYUZU_TESTS=OFF \
          -DYUZU_CMD=ON \
          -DYUZU_ROOM=OFF \
          -DYUZU_ROOM_STANDALONE=OFF \
          -DYUZU_USE_BUNDLED_QT=OFF \
          "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix zlib)" \
          "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
          -DVulkanHeaders_FORCE_BUNDLED=ON \
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
          -DENABLE_UPDATE_CHECKER=ON \
          -DLICHII_BUILD_TAG=build-${{ github.run_number }} \
          -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
          -DUSE_DISCORD_PRESENCE=OFF \
          -DUSE_CCACHE=ON
    - name: Configure MinGW PGO
      if: matrix.mingw
      shell: msys2 {0}
      run: |
        set -euo pipefail
        profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin \
          -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
        cmake -S . -B build/release -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF \
          -DYUZU_TESTS=OFF \
          -DYUZU_CMD=ON \
          -DYUZU_ROOM=OFF \
          -DYUZU_ROOM_STANDALONE=OFF \
          -DYUZU_USE_BUNDLED_QT=OFF \
          -DYUZU_USE_BUNDLED_SDL3=ON \
          -DYUZU_USE_BUNDLED_FFMPEG=ON \
          -DVulkanHeaders_FORCE_BUNDLED=ON \
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
          -DENABLE_UPDATE_CHECKER=ON \
          -DLICHII_BUILD_TAG=build-${{ github.run_number }} \
          -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
          -DUSE_DISCORD_PRESENCE=OFF \
          -DUSE_CCACHE=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
          "-DCMAKE_C_FLAGS=$profile" \
          "-DCMAKE_CXX_FLAGS=$profile"
    - name: Save CPM downloads
      if: steps.cpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: .cache/cpm
        key: ${{ steps.cpm-cache.outputs.cache-primary-key }}
    - name: Build
      if: ${{ ! matrix.mingw }}
      shell: bash
      run: |
        if command -v ccache > /dev/null; then ccache --zero-stats; else sccache --zero-stats; fi
        cmake --build build/release --target yuzu yuzu-cmd --parallel
        if command -v ccache > /dev/null; then ccache --show-stats; else sccache --show-stats; fi
    - name: Build MinGW PGO
      if: matrix.mingw
      shell: msys2 {0}
      run: |
        ccache --zero-stats
        cmake --build build/release --target yuzu yuzu-cmd --parallel
        ccache --show-stats
    - name: Stop sccache on Windows
      if: always() && matrix.platform == 'windows-x86_64' && steps.compiler-cache.outcome == 'success'
      shell: pwsh
      run: sccache --stop-server
    - name: Save compiler objects
      if: always() && steps.compiler-cache.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: |
          .ccache
          .sccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
    - name: Package Linux tar.gz
      if: startsWith(matrix.platform, 'linux')
      shell: bash
      run: |
        set -euo pipefail
        test -x build/release/bin/lichii
        test -x build/release/bin/eden-cli
        strip build/release/bin/lichii build/release/bin/eden-cli
        tar -czf "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" \
          -C build/release/bin lichii eden-cli
        ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz"
    - name: Package Linux AppImage
      if: startsWith(matrix.platform, 'linux')
      shell: bash
      run: |
        set -euo pipefail
        test -x build/release/bin/lichii
        test -x build/release/bin/eden-cli
        tools="$RUNNER_TEMP/linuxdeploy"
        mkdir -p "$tools"
        arch=$(uname -m)   # aarch64 or x86_64
        curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
        https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
        curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
        https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
        chmod +x "$tools"/*.AppImage
        # The desktop file names its icon io.github.zortos293.lichii.
        icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
        cp _arise/tools/emulators/kanario/kanario.png "$icon"
        export APPIMAGE_EXTRACT_AND_RUN=1
        export QMAKE="$QT_ROOT_DIR/bin/qmake"
        # Include Wayland platform plugins and their graphics/shell integrations.
        export EXTRA_QT_MODULES=waylandcompositor
        export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
        # Embedded in the AppImage metadata; matches the release tag (build-N) plus the commit.
        export LDAI_VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
        export LDAI_OUTPUT="lichii-${GITHUB_SHA}-${{ matrix.platform }}.AppImage"
        export OUTPUT="$LDAI_OUTPUT"
        export ARCH="$arch"
        "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
          --executable build/release/bin/lichii \
          --executable build/release/bin/eden-cli \
          --desktop-file dist/io.github.zortos293.lichii.desktop \
          --icon-file "$icon" \
          --plugin qt \
          --output appimage
        test -s "$LDAI_OUTPUT"
        ls -la "$LDAI_OUTPUT"
    - name: Package Windows binary
      if: matrix.platform == 'windows-x86_64'
      shell: pwsh
      run: |
        foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
          if (-not (Test-Path "build/release/bin/$exe")) {
            throw "build/release/bin/$exe was not produced"
          }
        }
        windeployqt --release --no-translations build/release/bin/lichii.exe
    - name: Package MinGW binary
      if: matrix.mingw
      shell: msys2 {0}
      run: |
        set -euo pipefail
        export PATH="/ucrt64/bin:$PATH"
        cd build/release/bin
        test -f lichii.exe
        test -f eden-cli.exe
        windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
          --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
        deps() {
          objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
            [ -z "$dll" ] && continue
            source=$(command -v "$dll" 2>/dev/null || true)
            [ -z "$source" ] && continue
            # The system DLLs ship with Windows, so they never need bundling.
            case "$source" in
              *System32* | *SysWOW64*) continue ;;
            esac
            if [ ! -f "$dll" ]; then
              cp "$source" "$dll"
              deps "$source"
            fi
          done
        }
        for exe in lichii.exe eden-cli.exe; do
          deps "$exe"
        done
        find . -name '*.dll' | while read -r dll; do
          deps "$dll"
        done
    - name: Package macOS app
      if: startsWith(matrix.platform, 'macos')
      shell: bash
      run: |
        set -euo pipefail
        app=build/release/bin/lichii.app
        test -x "$app/Contents/MacOS/lichii"
        test -x build/release/bin/eden-cli
        cp build/release/bin/eden-cli "$app/Contents/MacOS/eden-cli"
        "$(brew --prefix qt@6)/bin/macdeployqt" "$app" \
          -executable="$app/Contents/MacOS/eden-cli" -libpath="$(brew --prefix)/lib" \
          -always-overwrite -verbose=1
        # Qt's virtual keyboard input plugin pulls in the QML stack, which the emulator doesn't use.
        rm -f "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
        binaries=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) \
          -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
        for binary in $binaries; do
          otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
            { grep -E '^/(opt/homebrew|usr/local)/' || true; } | while read -r rpath; do
              install_name_tool -delete_rpath "$rpath" "$binary" 2> /dev/null
            done
        done
        # Libraries that load their dependencies through @rpath find them in the bundle.
        for program in lichii eden-cli; do
          install_name_tool -add_rpath @executable_path/../Frameworks \
            "$app/Contents/MacOS/$program" 2> /dev/null
        done
        leaks=$(for binary in $binaries; do
          otool -L "$binary" | grep -E '^\s+/(opt/homebrew|usr/local)/'
          otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
            grep -E '^/(opt/homebrew|usr/local)/'
        done || true)
        if [ -n "$leaks" ]; then
          echo "References still pointing outside the bundle:"
          echo "$leaks" | sort -u
          exit 1
        fi
        # macdeployqt invalidates the signatures. The programs get the entitlements when the
        # tree has them (the Hypervisor CPU backend needs com.apple.security.hypervisor).
        codesign --force --deep --sign - "$app"
        if [ -f dist/eglantine.entitlements ]; then
          codesign --force --sign - --entitlements dist/eglantine.entitlements \
            "$app/Contents/MacOS/eden-cli"
          codesign --force --sign - --entitlements dist/eglantine.entitlements "$app"
        fi
        codesign --verify --deep --strict "$app"
        ditto -c -k --keepParent "$app" "lichii-${GITHUB_SHA}-${{ matrix.platform }}.zip"
        ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.zip"
        # Also ship a .dmg (drag lichii.app onto Applications).
        dmgdir=$(mktemp -d)
        ditto "$app" "$dmgdir/lichii.app"
        ln -s /Applications "$dmgdir/Applications"
        hdiutil create -volname "Lichii" -srcfolder "$dmgdir" -ov -format UDZO \
          "lichii-${GITHUB_SHA}-${{ matrix.platform }}.dmg"
        ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.dmg"
    - name: Publish the AppImage on AriseOS
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        src=$(ls -1 *.AppImage | head -1)
        test -s "$src"
        asset="kanario-arise-linux-aarch64.AppImage"
        cp "$src" "$asset"
        tag="kanario-arise-b${{ github.run_number }}"
        if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$tag" "$asset" -R "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$tag" "$asset" -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "Kanario AriseOS b${{ github.run_number }} Linux ARM64" \
            --notes "AriseOS Kanario on Frizti/Lichii ${{ inputs.ref }} (Fritchii), built for Linux ARM64 with tools/emulators/patches/kanario and arise_patches.py."
        fi
        echo "Published $asset on $tag" >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 150
