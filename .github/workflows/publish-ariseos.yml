name: Publicar versão AriseOS
run-name: publicar AriseOS (${{ inputs.channel }}) a partir de main ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal: teste (só quem escolheu Teste recebe), estavel (todo mundo) ou promover (a versão de teste atual vira a estável, sem build novo)"
        type: choice
        options: [teste, estavel, promover]
        default: teste
      notes:
        description: O que mudou nesta versão (aparece na tela de Atualizações)
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-ariseos
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ler o catálogo atual
        run: |
          set -euo pipefail
          if git fetch -q --depth 1 origin catalog 2>/dev/null; then git show FETCH_HEAD:catalog.json > "$RUNNER_TEMP/old-catalog.json"; else echo '{}' > "$RUNNER_TEMP/old-catalog.json"; fi

      - name: Promover a versão de teste para estável
        if: inputs.channel == 'promover'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c "import json,sys;print((json.load(open(sys.argv[1])).get('preview') or {}).get('tag',''))" "$RUNNER_TEMP/old-catalog.json")
          [ -n "$tag" ] || { echo "::error::não há versão de teste publicada para promover"; exit 1; }
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
          python3 - "$RUNNER_TEMP/old-catalog.json" "$RUNNER_TEMP/catalog.json" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))
          c["stable"] = c["preview"]
          json.dump(c, open(sys.argv[2], "w"), indent=2)
          PY
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Promovida $tag de Teste para Estável." >> "$GITHUB_STEP_SUMMARY"

      - name: Baixar o APK assinado do build mais recente de main
        if: inputs.channel != 'promover'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=""; sha=""
          while read -r run head; do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
                   -q '[.jobs[] | select(.name == "sign / sign standard" and .conclusion == "success")] | length')
            if [ "$ok" = 1 ]; then id=$run; sha=$head; break; fi
          done < <(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main --status completed \
                     --json databaseId,headSha -L 15 -q '.[] | "\(.databaseId) \(.headSha)"')
          [ -n "$id" ] || { echo "::error::nenhum build assinado de main encontrado: rode o Build APK primeiro"; exit 1; }
          echo "Usando o build $id (main ${sha::7})" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_SHA=$sha" >> "$GITHUB_ENV"
          git fetch -q --depth 1 origin "$sha"
          git checkout -q "$sha"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n droiddeck-signed-standard -D signed
          ls -la signed

      - name: Criar a release e o catálogo
        if: inputs.channel != 'promover'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          name=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)
          code=$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' app/build.gradle)
          signer=$(tr -d ' \n' < keystore/release-signer.sha256 | tr 'A-F' 'a-f')
          tag="v$name"
          [[ $name =~ ^[0-9A-Za-z._-]+$ && $code =~ ^[0-9]+$ ]] || { echo "::error::versionName/versionCode inválidos em app/build.gradle"; exit 1; }
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a versão $tag já foi publicada: aumente versionName e versionCode em app/build.gradle"; exit 1
          fi
          apks=(signed/*.apk)
          [ ${#apks[@]} = 1 ] || { echo "::error::esperava um APK no build"; exit 1; }
          apk="AriseOS-$name.apk"
          cp "${apks[0]}" "$apk"
          body=${NOTES:-"AriseOS $name"}
          if [ "$CHANNEL" = teste ]; then
            gh release create "$tag" "$apk" -R "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --title "AriseOS $name (teste)" --notes "$body" --prerelease
          else
            gh release create "$tag" "$apk" -R "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --title "AriseOS $name" --notes "$body" --latest
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

          export TAG="$tag" NAME="$name" CODE="$code" SIGNER="$signer" APK="$apk" BODY="$body"
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time
          repo = os.environ["GITHUB_REPOSITORY"]
          apk = os.environ["APK"]
          data = open(apk, "rb").read()
          release = {
              "tag": os.environ["TAG"],
              "title": f"AriseOS {os.environ['NAME']}",
              "summary": os.environ["BODY"][:400],
              "commit": os.environ["BUILD_SHA"],
              "pr": 0,
              "version": os.environ["NAME"],
              "versionCode": int(os.environ["CODE"]),
              "publishedAt": int(time.time() * 1000),
              "url": f"https://github.com/{repo}/releases/tag/{os.environ['TAG']}",
              "apks": {
                  "com.droiddeck.launcher": {
                      "name": apk,
                      "url": f"https://github.com/{repo}/releases/download/{os.environ['TAG']}/{apk}",
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "packageName": "com.droiddeck.launcher",
                      "versionCode": int(os.environ["CODE"]),
                      "signerSha256": os.environ["SIGNER"],
                  }
              },
          }
          old = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "old-catalog.json")))
          catalog = {"schema": 1, "sourceRepo": repo, "ciRepo": repo, "stable": old.get("stable"), "preview": old.get("preview"),
                     "tests": [], "recentPreviews": []}
          if os.environ["CHANNEL"] == "teste":
              catalog["preview"] = release
              if catalog["stable"] is None:
                  catalog["stable"] = release
          else:
              catalog["stable"] = release
              # Whoever follows Teste also gets a Stable that is newer than the last test build.
              prev = catalog.get("preview") or {}
              if int(prev.get("versionCode") or 0) <= release["versionCode"]:
                  catalog["preview"] = release
          json.dump(catalog, open(os.path.join(os.environ["RUNNER_TEMP"], "catalog.json"), "w"), indent=2)
          PY


      - name: Gravar o catálogo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ariseos-catalog
          git rm -rfq .
          cp "$RUNNER_TEMP/catalog.json" catalog.json
          git add catalog.json
          git commit -qm "catalog: $TAG (${{ inputs.channel }})"
          git push -f origin HEAD:refs/heads/catalog
          echo "Catálogo atualizado: $TAG no canal ${{ inputs.channel }}." >> "$GITHUB_STEP_SUMMARY"
