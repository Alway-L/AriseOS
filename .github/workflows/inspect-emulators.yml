name: Inspect emulator releases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in Djihads80/Eglantine zortos293/Lichii; do
            echo "=== $r"
            gh api "repos/$r/releases?per_page=5" --jq '.[] | "\(.tag_name) prerelease=\(.prerelease) \(.published_at)\n" + ([.assets[] | "   \(.name) \(.size)"] | join("\n"))' || true
          done
