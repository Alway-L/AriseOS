name: Inspect emulator releases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Releases and archive layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          for r in PCSX2/pcsx2 KytyPS5/KytyPS5; do
            gh api "repos/$r/releases?per_page=3" --jq '.[] | "\(.tag_name) prerelease=\(.prerelease) \(.published_at)\n" + ([.assets[] | "   \(.name) \(.size)"] | join("\n"))' || true
            gh api "repos/$r/releases/latest" --jq '"LATEST " + .tag_name + "\n" + ([.assets[] | "   \(.name)"] | join("\n"))' || true
          done
          mkdir k && cd k
          url=$(gh api repos/KytyPS5/KytyPS5/releases --jq '[.[] | .assets[] | select(.name | test("[Ll]inux"))][0].browser_download_url')
          echo "URL $url"
          curl -sL "$url" -o kyty.archive
          file kyty.archive
          (tar tzf kyty.archive 2>/dev/null || unzip -l kyty.archive) | head -80
          mkdir x && (tar xzf kyty.archive -C x 2>/dev/null || unzip -q kyty.archive -d x)
          find x -maxdepth 3 -type f -perm -u+x | head -20
          for f in $(find x -maxdepth 3 -type f -perm -u+x | head -5); do file "$f"; ldd "$f" | head -40; done
