# AriseOS: builds the Linux ARM64 AppImage of Frizti's Lichii fork (Ocarina of Time fixes), which publishes
# Windows builds only, and attaches it to a release here for the app to download.
name: Build Lichii (Frizti) for Linux ARM64
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch of Frizti/Lichii
        required: true
        default: frizti-v1
permissions:
  contents: write
jobs:
  build:
    name: Lichii (Frizti) linux-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux-aarch64
          runner: ubuntu-24.04-arm
    steps:
    - name: Check out source
      uses: actions/checkout@v5
      with:
        repository: Frizti/Lichii
        ref: ${{ inputs.ref }}
    - name: Fix Linux-only build issues
      shell: bash
      run: |
        set -euo pipefail
        # The fork is built for Windows only. On Linux, vulkan.h pulls in Xlib.h, whose error-code macros (Success,
        # BadValue, ...) break NvResult in nvdata.h when a file includes Vulkan first (vk_flash_watch.cpp). Eden's
        # vulkan.h already undefines some X11 macros; add the error codes to that list.
        f=src/video_core/vulkan_common/vulkan.h
        if ! grep -q 'AriseOS: X11 error codes' "$f"; then
          codes="Success BadRequest BadValue BadWindow BadPixmap BadAtom BadCursor BadFont BadMatch BadDrawable BadAccess BadAlloc BadColor BadGC BadIDChoice BadName BadLength BadImplementation"
          {
            echo '// AriseOS: X11 error codes clash with enum members (NvResult::Success, NvResult::BadValue).'
            for c in $codes; do echo "#undef $c"; done
          } > /tmp/x11-undefs.h
          sed -i '/^#undef CreateEvent/r /tmp/x11-undefs.h' "$f"
        fi
        grep -n -A3 'AriseOS: X11 error codes' "$f"
        # Address space: let the kernel pick a free place for the 256 GiB block when the 64 fixed hints are taken
        # (the phone's Linux runtime), instead of failing and hanging the game.
        python3 - <<'PY'
        p = "src/common/host_memory.cpp"
        s = open(p).read()
        old = "    return MAP_FAILED;\n}\n"
        if "AriseOS: none of the 64" not in s and old in s:
            s = s.replace(old, """    // AriseOS: none of the 64 places was free (the phone's Linux runtime); let the kernel choose one.
            void* any = mmap(nullptr, virtual_size, PROT_READ | PROT_WRITE,
                             MAP_PRIVATE | MAP_ANONYMOUS | MAP_NORESERVE | MAP_NOCORE, -1, 0);
            if (any != MAP_FAILED) {
                LOG_WARNING(HW_Memory, "AriseOS: no free place among the 64 hints; using {} chosen by the kernel", any);
            }
            return any;
        }
        """, 1)
            open(p, "w").write(s)
            print("patched host_memory.cpp")
        PY
    - name: Install Linux dependencies
      if: startsWith(matrix.platform, 'linux')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
          libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
          mesa-common-dev nasm ninja-build qt6-base-private-dev \
          qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
          libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
          spirv-tools spirv-headers libusb-1.0-0-dev \
          libboost-dev libboost-fiber-dev libboost-context-dev \
          libopus-dev libasound2-dev ccache \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
    - name: Install Qt on Linux ARM64
      if: startsWith(matrix.platform, 'linux') && runner.arch == 'ARM64'
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: linux_arm64
        target: desktop
        arch: linux_gcc_arm64
        modules: qtcharts
        cache: true
    - name: Restore CPM downloads
      id: cpm-cache
      uses: actions/cache/restore@v5
      with:
        path: .cache/cpm
        key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
        restore-keys: |
          cpm-${{ matrix.platform }}-v2-
          cpm-${{ runner.os }}-
    - name: Restore compiler objects
      id: compiler-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          .ccache
          .sccache
        key: objects-${{ matrix.platform }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          objects-${{ matrix.platform }}-v2-${{ github.sha }}-
          objects-${{ matrix.platform }}-v2-
    - name: Configure Linux
      if: startsWith(matrix.platform, 'linux')
      shell: bash
      run: |
        set -euo pipefail
        flags=(
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DVulkanHeaders_FORCE_BUNDLED=ON
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DLICHII_BUILD_TAG=build-${{ github.run_number }}
          -DLICHII_BUILD_PLATFORM=${{ matrix.platform }}
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON
        )
        if [ '${{ matrix.pgo }}' = 'true' ]; then
          # Same flags Eden's CI passes for its clang PGO build.
          profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          flags+=(
            "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
            "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
            "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
            "-DCMAKE_C_FLAGS=$profile"
            "-DCMAKE_CXX_FLAGS=$profile"
          )
        fi
        cmake -S . -B build/release -G Ninja "${flags[@]}"
    - name: Save CPM downloads
      if: steps.cpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: .cache/cpm
        key: ${{ steps.cpm-cache.outputs.cache-primary-key }}
    - name: Build
      if: ${{ ! matrix.mingw }}
      shell: bash
      run: |
        if command -v ccache > /dev/null; then ccache --zero-stats; else sccache --zero-stats; fi
        cmake --build build/release --target yuzu yuzu-cmd --parallel
        if command -v ccache > /dev/null; then ccache --show-stats; else sccache --show-stats; fi
    - name: Save compiler objects
      if: always() && steps.compiler-cache.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: |
          .ccache
          .sccache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
    - name: Package Linux tar.gz
      if: startsWith(matrix.platform, 'linux')
      shell: bash
      run: |
        set -euo pipefail
        test -x build/release/bin/lichii
        test -x build/release/bin/eden-cli
        strip build/release/bin/lichii build/release/bin/eden-cli
        tar -czf "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz" \
          -C build/release/bin lichii eden-cli
        ls -la "lichii-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz"
    - name: Package Linux AppImage
      if: startsWith(matrix.platform, 'linux')
      shell: bash
      run: |
        set -euo pipefail
        test -x build/release/bin/lichii
        test -x build/release/bin/eden-cli
        tools="$RUNNER_TEMP/linuxdeploy"
        mkdir -p "$tools"
        arch=$(uname -m)   # aarch64 or x86_64
        curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
        https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
        curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
        https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
        chmod +x "$tools"/*.AppImage
        # The desktop file names its icon io.github.zortos293.lichii.
        icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
        cp dist/lichii.png "$icon"
        export APPIMAGE_EXTRACT_AND_RUN=1
        export QMAKE="$QT_ROOT_DIR/bin/qmake"
        # Include Wayland platform plugins and their graphics/shell integrations.
        export EXTRA_QT_MODULES=waylandcompositor
        export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
        # Embedded in the AppImage metadata; matches the release tag (build-N) plus the commit.
        export LDAI_VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
        export LDAI_OUTPUT="lichii-${GITHUB_SHA}-${{ matrix.platform }}.AppImage"
        export OUTPUT="$LDAI_OUTPUT"
        export ARCH="$arch"
        "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
          --executable build/release/bin/lichii \
          --executable build/release/bin/eden-cli \
          --desktop-file dist/io.github.zortos293.lichii.desktop \
          --icon-file "$icon" \
          --plugin qt \
          --output appimage
        test -s "$LDAI_OUTPUT"
        ls -la "$LDAI_OUTPUT"
    - name: Publish the AppImage on AriseOS
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        src="lichii-${GITHUB_SHA}-linux-aarch64.AppImage"
        test -s "$src"
        asset="lichii-frizti-linux-aarch64.AppImage"
        cp "$src" "$asset"
        tag="lichii-frizti-${{ inputs.ref }}"
        if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$tag" "$asset" -R "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$tag" "$asset" -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "Lichii (Frizti ${{ inputs.ref }}) Linux ARM64" \
            --notes "Linux ARM64 AppImage built from Frizti/Lichii ${{ inputs.ref }} for AriseOS (the fork publishes Windows builds only)."
        fi
        echo "Published $asset on $tag" >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 150
